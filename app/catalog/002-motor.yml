# Cars, bikes, trucks and motorsport, from the local theSVG clone.
# Curated subset: well-known brands only, roughly most famous first, and only
# marks that do not spell the brand name out. Monograms (BMW, MG, DS, RR) are
# fine; wordmark logos (Ford, Ferrari, Nissan, Volvo, ...) are left out because
# they give the answer away. 30 of the 39 are drawn at random per game.
id: motor
