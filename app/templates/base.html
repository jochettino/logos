<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1f">
  <title>{% block title %}Logos{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Guess the brand from its logo. One wrong answer ends the game. Can you name them all?{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Logos">
  <meta property="og:title" content="{% block meta_title %}Logos — name that brand{% endblock %}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ request.url_for('static', path='og-image.png') }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Logos pixel-art logo with the words name that brand">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.meta_title() }}">
  <meta name="twitter:description" content="{{ self.meta_description() }}">
  <meta name="twitter:image" content="{{ request.url_for('static', path='og-image.png') }}">
  <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
  <!-- Installed-app hints: Android uses the manifest, iOS reads these tags. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Logos">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body{% block body_attrs %}{% endblock %}>
  <main>
{% block content %}{% endblock %}
  </main>
{% block scripts %}{% endblock %}
</body>
</html>
