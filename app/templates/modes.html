{% extends "base.html" %}
{% block title %}Choose a game · Logos{% endblock %}
{% block content %}
    <header><h1>Logos</h1></header>
    <h2>Choose a game</h2>
    <nav class="menu" aria-label="Game modes">
      {% for category in categories %}
        <form method="post" action="{{ url_for('new_game') }}">
          <input type="hidden" name="mode" value="{{ category.id }}">
          <button type="submit" class="primary">{{ category.title }}</button>
          {% if category.description %}<p class="mode-desc">{{ category.description }}</p>{% endif %}
        </form>
      {% endfor %}
    </nav>
    <a class="link" href="{{ url_for('landing') }}">Main menu</a>
{% endblock %}
